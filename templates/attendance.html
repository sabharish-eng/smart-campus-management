{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">DAILY RECORD</p><h1>Attendance</h1><p>Choose a date and mark each student's status.</p></div></div><section class="panel"><form class="date-row" method="get"><label>Attendance date<input type="date" name="day" value="{{day}}" required></label><button class="button secondary">Load date</button></form><form method="post"><input type="hidden" name="day" value="{{day}}"><div class="table-wrap"><table><thead><tr><th>Register no.</th><th>Student</th><th>Department</th><th>Status</th></tr></thead><tbody>{% for s in students %}<tr><td>{{s.regno}}<input type="hidden" name="student_id" value="{{s.id}}"></td><td>{{s.name}}</td><td>{{s.department}}</td><td><select name="status_{{s.id}}"><option value="Present" {% if s.status=='Present' %}selected{% endif %}>Present</option><option value="Absent" {% if s.status=='Absent' or not s.status %}selected{% endif %}>Absent</option></select></td></tr>{% endfor %}</tbody></table></div><button class="button" type="submit">Save attendance</button></form></section>{% endblock %}
