{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">FACILITIES</p><h1>Rooms & spaces</h1><p>Check room capacity and availability.</p></div></div><section class="room-grid">{% for r in rooms %}<article class="panel room"><div class="room-top"><span class="room-symbol">▦</span><span class="pill {{'available' if r.status=='Available' else 'occupied'}}">{{r.status}}</span></div><h2>{{r.room_no}}</h2><p>{{r.room_type}}</p><div class="room-bottom"><span>Capacity <strong>{{r.capacity}}</strong></span><form method="post" action="{{url_for('room_status',room_id=r.id)}}"><button class="text-button">Set {{'occupied' if r.status=='Available' else 'available'}}</button></form></div></article>{% endfor %}</section>{% endblock %}
