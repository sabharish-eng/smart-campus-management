{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">CAMPUS DIRECTORY</p><h1>Students</h1><p>Add and manage student records.</p></div></div><section class="split"><form class="panel form" method="post"><h2>Add student</h2><label>Register number<input name="regno" required placeholder="e.g. IT24004"></label><label>Student name<input name="name" required placeholder="Full name"></label><label>Department<input name="department" required value="Information Technology"></label><label>Year<select name="year" required><option>II</option><option>I</option><option>III</option><option>IV</option></select></label><button class="button" type="submit">Add student</button></form><section class="panel"><div class="panel-head"><h2>Student list</h2><span>{{students|length}} records</span></div><div class="table-wrap"><table><thead><tr><th>Register no.</th><th>Name</th><th>Department</th><th>Year</th><th></th></tr></thead><tbody>{% for s in students %}<tr><td>{{s.regno}}</td><td>{{s.name}}</td><td>{{s.department}}</td><td>{{s.year}}</td><td><form method="post" action="{{url_for('delete_student',student_id=s.id)}}" onsubmit="return confirm('Remove this student?')"><button class="text-button danger">Remove</button></form></td></tr>{% endfor %}</tbody></table></div></section></section>{% endblock %}
